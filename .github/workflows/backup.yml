name: Encrypted database backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create encrypted backup
        run: npm run backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          BACKUP_OUTPUT: backup/cardsnap-backup.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cardsnap-encrypted-backup-${{ github.run_id }}
          path: backup/cardsnap-backup.bin
          retention-days: 30
          if-no-files-found: error
